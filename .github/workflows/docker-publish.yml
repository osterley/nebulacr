name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SPECTONCR_BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Once the new image is in GHCR, tell the ops/deploy repo to roll it
      # out. Cross-repo via repository_dispatch (the deploy repo owns the
      # cluster credentials and the Helm release — see
      # deploy/ci-templates/README.md). Immutable coordinates travel in the
      # payload so the deploy pins an exact image, not a moving :latest.
      #
      # Fully self-guarding: on PRs, or when DEPLOY_REPO / DEPLOY_DISPATCH_TOKEN
      # aren't configured, this is a logged no-op — it never reddens a build.
      - name: Dispatch deploy to ops repo
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DEPLOY_REPO: ${{ vars.DEPLOY_REPO }}
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$DEPLOY_REPO" ] || [ -z "$DEPLOY_DISPATCH_TOKEN" ]; then
            echo "::warning::DEPLOY_REPO var or DEPLOY_DISPATCH_TOKEN secret not set — skipping deploy dispatch."
            exit 0
          fi

          # Release tags (vX.Y.Z) deploy that exact version to prod; every
          # other main push deploys the immutable short-SHA tag to acc.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            DEPLOY_TAG="${GITHUB_REF#refs/tags/v}"
            ENVIRONMENT="prod"
          else
            DEPLOY_TAG="${GITHUB_SHA::7}"
            ENVIRONMENT="acc"
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"

          echo "Dispatching deploy → ${DEPLOY_REPO}: ${IMAGE}:${DEPLOY_TAG} (env=${ENVIRONMENT})"
          PAYLOAD="$(jq -nc \
            --arg image "$IMAGE" \
            --arg tag "$DEPLOY_TAG" \
            --arg digest "$DIGEST" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg env "$ENVIRONMENT" \
            '{event_type:"spectoncr-image-published",
              client_payload:{image:$image, tag:$tag, digest:$digest, sha:$sha, ref:$ref, environment:$env}}')"

          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOY_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOY_REPO}/dispatches" \
            -d "$PAYLOAD"
          echo "Dispatched."
