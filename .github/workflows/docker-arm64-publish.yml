name: Publish arm64 image

# arm64 lives in its OWN workflow, on GitHub's native arm64 runners (no QEMU),
# so it never gates the fast amd64 build/deploy path (docker-hub-publish.yml is
# amd64-only). Runs on release tags and on demand. Publishes arch-suffixed tags
# (`:<version>-arm64`, `:arm64`) so it never clobbers the amd64 `:latest` the
# clusters run; combine into a unified multi-arch manifest later if desired.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: from git tag, else 'edge')"
        required: false
        default: ""

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/spectoncr

jobs:
  build-arm64:
    name: Build & Push arm64 (native)
    runs-on: ubuntu-24.04-arm      # native arm64 hosted runner — no emulation
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so `git describe` finds tags

      - name: Build metadata
        id: bmeta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          GHCR="ghcr.io/${{ github.repository }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            V="${{ github.event.inputs.tag }}"
          else
            V="edge"
          fi
          echo "list=${DOCKERHUB_REPO}:${V}-arm64,${DOCKERHUB_REPO}:arm64,${GHCR}:${V}-arm64,${GHCR}:arm64" >> "$GITHUB_OUTPUT"
          echo "arm64 tags: ${V}-arm64, arm64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64, native)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            SPECTONCR_VERSION=${{ steps.bmeta.outputs.version }}
            SPECTONCR_BUILD_HASH=${{ steps.bmeta.outputs.sha }}
            SPECTONCR_BUILD_TIME=${{ steps.bmeta.outputs.time }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
